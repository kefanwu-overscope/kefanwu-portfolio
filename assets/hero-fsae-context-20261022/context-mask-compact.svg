<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1238" viewBox="0 0 2200 1238">
  <!-- Same two continuous photo zones as the 2026-10-13 mask; the car zone now
       feathers outward with a Gaussian fall-off on its left and bottom edges.
       No component contours, tube traces, or holes are drawn. -->
  <defs>
    <linearGradient id="car-horizontal" gradientUnits="userSpaceOnUse" x1="600" y1="0" x2="1900" y2="0">
      <stop offset="0" stop-color="white" stop-opacity="0"/>
      <stop offset="0.019231" stop-color="white" stop-opacity="0.0228"/>
      <stop offset="0.038462" stop-color="white" stop-opacity="0.0439"/>
      <stop offset="0.057692" stop-color="white" stop-opacity="0.0796"/>
      <stop offset="0.076923" stop-color="white" stop-opacity="0.1353"/>
      <stop offset="0.096154" stop-color="white" stop-opacity="0.2163"/>
      <stop offset="0.115385" stop-color="white" stop-opacity="0.3247"/>
      <stop offset="0.134615" stop-color="white" stop-opacity="0.4578"/>
      <stop offset="0.153846" stop-color="white" stop-opacity="0.6065"/>
      <stop offset="0.173077" stop-color="white" stop-opacity="0.7548"/>
      <stop offset="0.192308" stop-color="white" stop-opacity="0.8825"/>
      <stop offset="0.211538" stop-color="white" stop-opacity="0.9692"/>
      <stop offset="0.230769" stop-color="white"/>
      <stop offset="0.923077" stop-color="white"/>
      <stop offset="0.95" stop-color="white" stop-opacity="0.65"/>
      <stop offset="0.973077" stop-color="white" stop-opacity="0.15"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="car-vertical" gradientUnits="userSpaceOnUse" x1="0" y1="510" x2="0" y2="1050">
      <stop offset="0" stop-color="white" stop-opacity="0"/>
      <stop offset="0.037037" stop-color="white" stop-opacity="0.15"/>
      <stop offset="0.101852" stop-color="white" stop-opacity="0.65"/>
      <stop offset="0.148148" stop-color="white"/>
      <stop offset="0.833333" stop-color="white"/>
      <stop offset="0.847222" stop-color="white" stop-opacity="0.9692"/>
      <stop offset="0.861111" stop-color="white" stop-opacity="0.8825"/>
      <stop offset="0.875" stop-color="white" stop-opacity="0.7548"/>
      <stop offset="0.888889" stop-color="white" stop-opacity="0.6065"/>
      <stop offset="0.902778" stop-color="white" stop-opacity="0.4578"/>
      <stop offset="0.916667" stop-color="white" stop-opacity="0.3247"/>
      <stop offset="0.930556" stop-color="white" stop-opacity="0.2163"/>
      <stop offset="0.944444" stop-color="white" stop-opacity="0.1353"/>
      <stop offset="0.958333" stop-color="white" stop-opacity="0.0796"/>
      <stop offset="0.972222" stop-color="white" stop-opacity="0.0439"/>
      <stop offset="0.986111" stop-color="white" stop-opacity="0.0228"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="driver-horizontal" gradientUnits="userSpaceOnUse" x1="1260" y1="0" x2="1740" y2="0">
      <stop offset="0" stop-color="white" stop-opacity="0"/>
      <stop offset=".0625" stop-color="white" stop-opacity=".15"/>
      <stop offset=".145833" stop-color="white" stop-opacity=".65"/>
      <stop offset=".208333" stop-color="white"/>
      <stop offset=".791667" stop-color="white"/>
